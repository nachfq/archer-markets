name: Verify options PoC
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: docker version
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run typecheck
      - run: npm --prefix web run lint
      - run: npm run build
      - name: Generated files are committed
        run: git diff --exit-code
      - run: npm audit --audit-level=moderate
      - run: npm --prefix web audit --audit-level=moderate

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [v4, legacy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: docker version
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm run contracts:build
      - run: npm run abi
      - run: npm run sdk:build
      - run: npx playwright install --with-deps chromium
      - name: Isolated V4 acceptance
        if: matrix.suite == 'v4'
        run: npm run test:acceptance:v4
      - name: Isolated legacy acceptance
        if: matrix.suite == 'legacy'
        run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-acceptance-evidence-${{ matrix.suite }}
          path: |
            .qa-tmp-e2e-*/summary.json
            .qa-tmp-e2e-*/*.log
            .qa-tmp-e2e-*/local-*.json
            .qa-tmp-e2e-*/options-*.png
          include-hidden-files: true
