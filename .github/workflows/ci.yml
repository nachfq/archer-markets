name: Verify options PoC
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: docker version
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix web run lint
      - run: npm audit --audit-level=moderate
      - run: npm --prefix web audit --audit-level=moderate
      - name: Isolated protocol, SDK and browser acceptance
        run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-acceptance-evidence
          path: |
            .qa-tmp-e2e-*/summary.json
            .qa-tmp-e2e-*/*.log
            .qa-tmp-e2e-*/local-*.json
            .qa-tmp-e2e-*/options-*.png
          include-hidden-files: true
