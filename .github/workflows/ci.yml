name: Verify options PoC
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: docker version
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run typecheck
      - run: npm --prefix web run lint
      - run: npm run build
      - name: Generated files are committed
        run: git diff --exit-code
      - run: npm audit --audit-level=moderate
      - run: npm --prefix web audit --audit-level=moderate

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: docker version
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm run contracts:build
      - run: npm run abi
      - run: npm run sdk:build
      - run: npx playwright install --with-deps chromium
      - name: Isolated V4 acceptance
        run: npm run test:acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-acceptance-evidence-v4
          path: |
            .qa-tmp-e2e-*/summary.json
            .qa-tmp-e2e-*/*.log
            .qa-tmp-e2e-*/local-*.json
            .qa-tmp-e2e-*/options-*.png
          include-hidden-files: true
