name: Verify options PoC
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: npm ci
      - run: npm run contracts:deps
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual local transactions
        shell: bash
        run: |
          anvil --silent --host 127.0.0.1 --chain-id 31337 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID"' EXIT
          node scripts/wait-anvil.mjs
          npm run deploy:local
          npm run test:e2e
          npm run seed:local
          npm run dev:local > /tmp/stock-options-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$ANVIL_PID" "$WEB_PID"' EXIT
          node scripts/wait-web.mjs
          npm run test:browser
